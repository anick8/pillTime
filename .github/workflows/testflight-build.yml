name: Build and Submit to TestFlight

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        run: npm install -g eas-cli

      - name: Set up iOS credentials
        run: |
          mkdir -p ~/.eas
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          # ASC API Key
          echo "${{ secrets.ASC_API_KEY }}" > /Users/runner/.eas/AuthKey_NCW9T7658N.p8
          chmod 600 /Users/runner/.eas/AuthKey_NCW9T7658N.p8
          # Distribution certificate - import to keychain
          echo "${{ secrets.IOS_DISTRIBUTION_P12 }}" | base64 -d > /tmp/ios_distribution.p12
          security import /tmp/ios_distribution.p12 -P password -A -t cert -f pkcs12 -k ~/Library/Keychains/login.keychain-db
          # Provisioning profile
          echo "${{ secrets.IOS_PROVISIONING_PROFILE }}" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/pillTime_PP.mobileprovision
          chmod 600 ~/Library/MobileDevice/Provisioning\ Profiles/pillTime_PP.mobileprovision
          rm /tmp/ios_distribution.p12

      - name: Build for TestFlight
        run: eas build --platform ios --profile production --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EAS_TOKEN }}

      - name: Submit to TestFlight
        run: eas submit --platform ios --profile production --latest --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EAS_TOKEN }}
